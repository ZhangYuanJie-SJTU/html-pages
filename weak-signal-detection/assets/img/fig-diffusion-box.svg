<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b1f23"/>
    </marker>
  </defs>

  <!-- 半导体块：5 列 3 行 -->
  <g stroke="#4a5259" stroke-width="1">
    <rect x="80" y="80" width="116" height="36" fill="#0f5f5c" opacity="0.42"/>
    <rect x="196" y="80" width="116" height="36" fill="#0f5f5c" opacity="0.34"/>
    <rect x="312" y="80" width="116" height="36" fill="#0f5f5c" opacity="0.25"/>
    <rect x="428" y="80" width="116" height="36" fill="#0f5f5c" opacity="0.16"/>
    <rect x="544" y="80" width="116" height="36" fill="#0f5f5c" opacity="0.08"/>
    <rect x="80" y="116" width="116" height="36" fill="#0f5f5c" opacity="0.42"/>
    <rect x="196" y="116" width="116" height="36" fill="#0f5f5c" opacity="0.34"/>
    <rect x="312" y="116" width="116" height="36" fill="#0f5f5c" opacity="0.25"/>
    <rect x="428" y="116" width="116" height="36" fill="#0f5f5c" opacity="0.16"/>
    <rect x="544" y="116" width="116" height="36" fill="#0f5f5c" opacity="0.08"/>
    <rect x="80" y="152" width="116" height="36" fill="#0f5f5c" opacity="0.42"/>
    <rect x="196" y="152" width="116" height="36" fill="#0f5f5c" opacity="0.34"/>
    <rect x="312" y="152" width="116" height="36" fill="#0f5f5c" opacity="0.25"/>
    <rect x="428" y="152" width="116" height="36" fill="#0f5f5c" opacity="0.16"/>
    <rect x="544" y="152" width="116" height="36" fill="#0f5f5c" opacity="0.08"/>
  </g>
  <rect x="80" y="80" width="580" height="108" fill="none" stroke="#1b1f23" stroke-width="1.6"/>

  <!-- 单盒标注 -->
  <rect x="312" y="80" width="116" height="36" fill="none" stroke="#a8451f" stroke-width="2.2"/>
  <text x="370" y="72" text-anchor="middle" font-size="12" fill="#a8451f">基本盒 Δx·Δy·Δz</text>

  <!-- Δx 标注 -->
  <line x1="312" y1="200" x2="428" y2="200" stroke="#4a5259" stroke-width="1"/>
  <line x1="312" y1="196" x2="312" y2="204" stroke="#4a5259" stroke-width="1"/>
  <line x1="428" y1="196" x2="428" y2="204" stroke="#4a5259" stroke-width="1"/>
  <text x="370" y="217" text-anchor="middle" font-size="12" fill="#4a5259">Δx</text>

  <!-- Δy 标注 -->
  <line x1="64" y1="116" x2="64" y2="152" stroke="#4a5259" stroke-width="1"/>
  <line x1="60" y1="116" x2="68" y2="116" stroke="#4a5259" stroke-width="1"/>
  <line x1="60" y1="152" x2="68" y2="152" stroke="#4a5259" stroke-width="1"/>
  <text x="50" y="138" text-anchor="end" font-size="12" fill="#4a5259">Δy</text>

  <!-- 浓度梯度 -->
  <text x="80" y="52" font-size="12" fill="#4a5259">电子浓度 n(x) 沿 x 递减 →</text>
  <line x1="80" y1="60" x2="640" y2="60" stroke="#8b9198" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 电子跃迁箭头 -->
  <line x1="332" y1="142" x2="416" y2="142" stroke="#1b1f23" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="374" y="128" text-anchor="middle" font-size="11.5" fill="#1b1f23">随机跃迁</text>

  <text x="80" y="248" font-size="11.5" fill="#4a5259">每次跃迁是独立随机事件 → 电流既有确定分量（扩散电流），又有随机涨落（扩散噪声）</text>
</svg>
