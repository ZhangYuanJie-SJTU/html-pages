<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1b1f23"/>
    </marker>
  </defs>

  <rect x="150" y="40" width="470" height="170" fill="#a8451f" opacity="0.05"/>
  <line x1="150" y1="40" x2="150" y2="210" stroke="#a8451f" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="620" y1="40" x2="620" y2="210" stroke="#a8451f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="385" y="30" text-anchor="middle" font-size="12" fill="#a8451f">反偏耗尽层：强电场 E</text>

  <circle cx="105" cy="125" r="6" fill="#1f3a5f"/>
  <line x1="113" y1="125" x2="172" y2="125" stroke="#1b1f23" stroke-width="1.6" marker-end="url(#a5)"/>
  <text x="60" y="112" font-size="12" fill="#1f3a5f">入射电子</text>
  <text x="60" y="142" font-size="11.5" fill="#8b9198">获得动能 qE·λ</text>

  <!-- 二分层级：1 → 2 → 4 → 8 -->
  <g stroke="#0f5f5c" stroke-width="1.4" fill="none">
    <path d="M182,125 L244,85"/><path d="M182,125 L244,165"/>
    <path d="M258,85 L320,65"/><path d="M258,85 L320,105"/>
    <path d="M258,165 L320,145"/><path d="M258,165 L320,185"/>
    <path d="M334,65 L396,53"/><path d="M334,65 L396,77"/>
    <path d="M334,105 L396,93"/><path d="M334,105 L396,117"/>
    <path d="M334,145 L396,133"/><path d="M334,145 L396,157"/>
    <path d="M334,185 L396,173"/><path d="M334,185 L396,197"/>
  </g>
  <g fill="#0f5f5c">
    <circle cx="176" cy="125" r="5"/>
    <circle cx="250" cy="85" r="5"/><circle cx="250" cy="165" r="5"/>
    <circle cx="326" cy="65" r="4.5"/><circle cx="326" cy="105" r="4.5"/>
    <circle cx="326" cy="145" r="4.5"/><circle cx="326" cy="185" r="4.5"/>
    <circle cx="402" cy="53" r="4"/><circle cx="402" cy="77" r="4"/>
    <circle cx="402" cy="93" r="4"/><circle cx="402" cy="117" r="4"/>
    <circle cx="402" cy="133" r="4"/><circle cx="402" cy="157" r="4"/>
    <circle cx="402" cy="173" r="4"/><circle cx="402" cy="197" r="4"/>
  </g>

  <text x="448" y="121" font-size="12" fill="#8b9198">…</text>
  <text x="360" y="232" text-anchor="middle" font-size="11.5" fill="#0f5f5c">倍增代数：1 → 2 → 4 → 8 → …</text>
  <text x="360" y="258" text-anchor="middle" font-size="11.5" fill="#4a5259">每撞一次多一对电子–空穴；倍增因子 M 是时间与空间的随机变量</text>

  <text x="650" y="112" font-size="12" fill="#a8451f">输出电流</text>
  <text x="650" y="134" font-size="13" fill="#a8451f">I = M·I₀</text>
  <line x1="622" y1="125" x2="644" y2="125" stroke="#a8451f" stroke-width="1.6"/>
</svg>
