<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f5f5c"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8451f"/>
    </marker>
  </defs>

  <rect x="40" y="104" width="220" height="72" rx="8" fill="#1f3a5f" opacity="0.07" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="150" y="134" text-anchor="middle" font-size="14" fill="#1f3a5f">宏观自由度</text>
  <text x="150" y="156" text-anchor="middle" font-size="12" fill="#4a5259">电压 / 电流（少数几个量）</text>

  <rect x="500" y="104" width="220" height="72" rx="8" fill="#b4762a" opacity="0.09" stroke="#b4762a" stroke-width="1.6"/>
  <text x="610" y="134" text-anchor="middle" font-size="14" fill="#8a5a1f">热自由度</text>
  <text x="610" y="156" text-anchor="middle" font-size="12" fill="#4a5259">10²³ 个电子的无规运动</text>

  <!-- 上：耗散 -->
  <path d="M270,120 C330,74 470,74 495,116" fill="none" stroke="#0f5f5c" stroke-width="2" marker-end="url(#a2)"/>
  <text x="382" y="52" text-anchor="middle" font-size="13" fill="#0f5f5c">耗散：宏观能量 → 热</text>
  <text x="382" y="72" text-anchor="middle" font-size="11.5" fill="#8b9198">电流流过电阻，电能变热</text>

  <!-- 下：涨落 -->
  <path d="M495,160 C470,202 330,202 270,160" fill="none" stroke="#a8451f" stroke-width="2" marker-end="url(#a3)"/>
  <text x="382" y="212" text-anchor="middle" font-size="13" fill="#a8451f">涨落：热 → 宏观</text>
  <text x="382" y="232" text-anchor="middle" font-size="11.5" fill="#8b9198">这就是热噪声（Nyquist 噪声）</text>

  <text x="382" y="28" text-anchor="middle" font-size="11.5" fill="#4a5259">同一枚硬币的两面：能流出去是耗散，流回来就是噪声</text>
  <text x="382" y="272" text-anchor="middle" font-size="11.5" fill="#4a5259">平衡时双向能流相等 → 平均电压为零，但瞬时涨落永远存在</text>
</svg>
